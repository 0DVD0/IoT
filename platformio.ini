[platformio]
; megaatmega2560_lab22
; megaatmega2560_lab31_ntc
; megaatmega2560_lab32_ntc
; megaatmega2560_lab31_ldr
; megaatmega2560_lab32_ldr
; megaatmega2560_lab31_joystick
; megaatmega2560_lab32_joystick
default_envs = megaatmega2560_lab41

; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino

monitor_speed = 9600

; Laboratoarele fara RTOS nu trebuie sa lege schedulerul FreeRTOS.
build_src_filter = +<*> -<lab_2/app_lab_2.2.cpp> -<lab_3/> -<lab_4/app_lab_4.2.cpp>

[env:megaatmega2560_lab22]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
build_flags = -D LAB_SELECT=3
build_src_filter = -<*> +<main.cpp> +<lab_2/app_lab_2.2.cpp>
lib_deps = feilipu/FreeRTOS

[env:megaatmega2560_lab31_ntc]
